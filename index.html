<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SSH Console" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>SSH Console — SSH-Zertifikats- &amp; Befehlskonsole für Debian Trixie</title>
    <meta
      name="description"
      content="Rust-basiertes SSH-Webinterface für Debian Trixie mit Admin-Ersteinrichtung, Benutzerverwaltung ohne Registrierung, zentralen SSH-Befehlen und passwortloser OpenSSH-Zertifikatsanmeldung."
    />
    <meta property="og:title" content="SSH Console — SSH-Zertifikats- &amp; Befehlskonsole für Debian Trixie" />
    <meta
      property="og:description"
      content="Rust-basiertes SSH-Webinterface für Debian Trixie mit Admin-Ersteinrichtung, Benutzerverwaltung ohne Registrierung, zentralen SSH-Befehlen und passwortloser OpenSSH-Zertifikatsanmeldung."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('ssh_console_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#020617');
          } else if (metaTheme) {
            metaTheme.setAttribute('content', '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-100 dark:selection:bg-blue-900/60 selection:text-blue-900 dark:selection:text-blue-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
